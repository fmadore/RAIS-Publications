# RAIS publications: test on every push and pull request; rebuild from the
# ERef feed and deploy to GitHub Pages on main, weekly and on a manual run
# (Actions → Pages → Run workflow).
#
# The build job downloads EmbeddingGemma 2 (~1.5 GB) once and keeps it, the
# pip wheels and the per-card vector cache in the Actions cache, so a
# scheduled rebuild only embeds new or edited records. The model is open
# (Apache 2.0) and needs no token; add HF_TOKEN as a repository secret only if
# the Hub starts rate-limiting the runner.

name: Pages

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Never cancel a run on main midway through a deployment.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHONUNBUFFERED: "1"
  HF_HOME: ${{ github.workspace }}/.cache/huggingface
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  build:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      # Keyed on the pinned model revision: a new revision is a new vector
      # space, so it starts fresh caches rather than mixing two.
      - name: Restore the model
        uses: actions/cache@v6
        with:
          path: .cache/huggingface
          key: embeddinggemma-2-914f7f89142e
      # Actions caches are immutable, so the vector cache is saved under a
      # new key on every run and restored from the latest one.
      - name: Restore the vector cache
        uses: actions/cache@v6
        with:
          path: build/cache
          key: vectors-914f7f89142e-${{ github.run_id }}
          restore-keys: vectors-914f7f89142e-
      - run: pip install -r requirements-model.txt
      - run: python -m rais build --out public
      - run: cat public/data/report.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
