[project]
name = "rais-publications"
version = "0.1.0"
description = "Static, iframe-embeddable visualisations of the RAIS publications recorded in ERef Bayreuth."
license = "GPL-3.0-or-later"
authors = [{ name = "Frédérick Madore", email = "frederick.madore@uni-bayreuth.de" }]
requires-python = ">=3.12"

[project.urls]
Homepage = "https://fmadore.github.io/RAIS-Publications/"
Repository = "https://github.com/fmadore/RAIS-Publications"
Author = "https://www.frederickmadore.com/"

[tool.setuptools]
packages = ["rais"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["web/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E501"]
