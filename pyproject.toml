[project]
name = "rais-publications"
version = "0.1.0"
description = "Static, iframe-embeddable visualisations of the RAIS publications recorded in ERef Bayreuth."
license = "GPL-3.0-or-later"
requires-python = ">=3.12"

[tool.setuptools]
packages = ["rais"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["web/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E501"]
